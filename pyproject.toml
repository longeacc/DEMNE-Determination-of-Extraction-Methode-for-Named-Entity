[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "DEMNE"
version = "0.3.0"
description = "Cascade NLP pipeline for oncological biomarker extraction — optimizing the Performance-Explainability-Frugality trilemma"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Clément Longeac", email = "clement.longeac@edu.esiee.fr"},
]
keywords = ["NLP", "NER", "oncology", "biomarkers", "frugal-AI", "cascade"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.10",
]

dependencies = [
    "numpy>=1.24,<2.0",
    "pandas>=2.0,<3.0",
    "matplotlib>=3.7",
    "plotly>=5.18,<6.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "eco2ai>=0.3",
    "seaborn>=0.13",
    "Unidecode>=1.3",
]

[project.optional-dependencies]
ner = [
    "torch>=2.0",
    "transformers>=4.36",
    "datasets>=2.16",
    "seqeval>=1.2",
    "pycrfsuite>=0.9",
]
rest = [
    "spacy>=3.7",
    "python-Levenshtein>=0.25",
    "nltk>=3.8",
    "inflect>=7.0",
    "bqplot>=0.12",
    "ipydatagrid>=1.2",
    "ipywidgets>=8.0",
    "ipyfilechooser>=0.6",
]
viz = [
    "networkx>=3.2",
]
notebook = [
    "nbformat>=5.9",
]
reports = [
    "reportlab>=4.0",
]
gui = [
    "pywebview>=5.0",
]
dashboard = [
    "streamlit>=1.30",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "black>=24.0",
    "isort>=5.13",
    "ruff>=0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests", "src/demne/tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501", "N999", "F403", "F405", "E402"]
