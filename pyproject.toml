[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "DEMNE"
version = "0.3.0"
description = "Cascade NLP pipeline for oncological biomarker extraction — optimizing the Performance-Explainability-Frugality trilemma"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Clément Longeac", email = "clement.longeac@edu.esiee.fr"},
]
keywords = ["NLP", "NER", "oncology", "biomarkers", "frugal-AI", "cascade"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24,<2.0",
    "pandas>=2.0,<3.0",
    "matplotlib>=3.7",
    "plotly>=5.18,<6.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "eco2ai>=0.3",
    "seaborn>=0.13",
    "Unidecode>=1.3",
]

[project.urls]
Homepage = "https://github.com/longeacc/DEMNE-Determination-of-Extraction-Methode-for-Named-Entity"
Repository = "https://github.com/longeacc/DEMNE-Determination-of-Extraction-Methode-for-Named-Entity"
"Bug Tracker" = "https://github.com/longeacc/DEMNE-Determination-of-Extraction-Methode-for-Named-Entity/issues"
Documentation = "https://github.com/longeacc/DEMNE-Determination-of-Extraction-Methode-for-Named-Entity#readme"

[project.optional-dependencies]
ner = [
    "torch>=2.0",
    "transformers>=4.36",
    "datasets>=2.16",
    "seqeval>=1.2",
]
rest = [
    "spacy>=3.7",
    "python-Levenshtein>=0.25",
    "nltk>=3.8",
    "inflect>=7.0",
    "bqplot>=0.12",
    "ipydatagrid>=1.2",
    "ipywidgets>=8.0",
    "ipyfilechooser>=0.6",
]
viz = [
    "networkx>=3.2",
]
notebook = [
    "nbformat>=5.9",
]
reports = [
    "reportlab>=4.0",
]
gui = [
    "pywebview>=5.0",
]
dashboard = [
    "streamlit>=1.30",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "black>=24.0",
    "isort>=5.13",
    "ruff>=0.2",
    "pre-commit>=3.7",
]
# Extra for GPU tests (torch is already in [ner], listed here for clarity)
gpu = [
    "torch>=2.0",
    "transformers>=4.36",
    "nvidia-ml-py>=12.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
demne = [
    "data/*.json",
    "REST_interface/templates/*.html",
    "REST_interface/*.ipynb",
    "REST_interface/*.png",
    "REST_interface/*.md",
    "REST_interface/Evaluation/REST_Annotations/*.ann",
    "REST_interface/Results/figures/*.png",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"
# Custom markers: declared here to avoid PytestUnknownMarkWarning.
# Usage:
#   pytest -m unit            → isolated unit tests only
#   pytest -m integration     → pipeline integration tests only
#   pytest -m "cuda or rocm"  → GPU tests (auto-skipped if no GPU present)
#   pytest -m "not cuda and not rocm"  → everything except GPU (standard CI behaviour)
markers = [
    "unit: isolated unit tests, no disk I/O or GPU",
    "integration: pipeline integration tests (disk I/O, multi-scorers)",
    "cuda: tests requiring an NVIDIA GPU with CUDA (skipped if absent)",
    "rocm: tests requiring an AMD GPU with ROCm (skipped if absent)",
    "slow: long-running tests (fine-tuning, full model loading)",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501", "N999", "F403", "F405", "E402"]
