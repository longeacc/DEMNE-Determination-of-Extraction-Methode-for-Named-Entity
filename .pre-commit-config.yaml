repos:
  - repo: local
    hooks:
      - id: autofix
        name: black + ruff (format, fix, auto-stage)
        language: system
        entry: bash -c 'black --line-length=100 . && ruff check --fix . && git add -u'
        pass_filenames: false
        always_run: true

      - id: pytest-fast
        name: pytest (CPU-only, no GPU)
        language: system
        entry: python -m pytest -m "not cuda and not rocm" --tb=short -q --no-header
        pass_filenames: false
        always_run: true
