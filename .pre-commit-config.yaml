repos:
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3
        args: ["--line-length=100"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]

  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest (CPU-only, no GPU)
        language: system
        entry: python -m pytest -m "not cuda and not rocm" --tb=short -q --no-header
        pass_filenames: false
        always_run: true
