# DEMNE — DrBERT NER Fine-Tuning Configuration
# =============================================
#
# All hyperparameters for fine_tuning/train.py are externalised here.
# Override any value via CLI arguments or by editing this file.
#
# Calibrated for DrBERT-7GB on 3 DEMNE oncology corpora
# (Cantemist-35 + Redjdal thesis + RCP/ESMO).
#
# Reference: Longeac, Redjdal & Kempf — DEMNE (2025)

# --- Model ---
model_name: "Dr-BERT/DrBERT-7GB"
max_length: 512

# --- Training ---
learning_rate: 2.0e-5
num_train_epochs: 10
per_device_train_batch_size: 16
per_device_eval_batch_size: 32
warmup_ratio: 0.1
weight_decay: 0.01
lr_scheduler_type: "linear"
fp16: true                  # Disable if no NVIDIA GPU

# --- Early stopping ---
early_stopping_patience: 3

# --- Reproducibility ---
seed: 42

# --- Logging ---
logging_steps: 50

# --- Paths ---
output_dir: "models/drbert_finetuned"
results_dir: "results"
