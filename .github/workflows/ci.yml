name: CI

on:
  push:
    # Triggered on development branches AND on vX.Y.Z tags
    # (tags act as the trigger for the publish job)
    branches: [main, develop]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # -----------------------------------------------------------------------
      # Cache pip: GitHub caches ~/.cache/pip between runs.
      # Key includes OS, Python version, and a hash of pyproject.toml.
      # If pyproject.toml hasn't changed, the cache is reused → ~30-60 s
      # of installation saved per runner.
      # -----------------------------------------------------------------------
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          pip install -e ".[dev,ner]"

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with black
        run: black --check .

      # -----------------------------------------------------------------------
      # Type-check with mypy.
      # Installed separately (not in the dev group) to keep the prod env light.
      # --ignore-missing-imports suppresses errors for libs without stubs
      # (eco2ai, seqeval…).
      # -----------------------------------------------------------------------
      - name: Type-check with mypy
        run: |
          pip install mypy
          mypy src/demne --ignore-missing-imports --no-error-summary

      # -----------------------------------------------------------------------
      # CPU-only tests: GPU tests are explicitly excluded
      # (-m "not cuda and not rocm") so the job never tries to load a model
      # on a non-existent GPU (which would raise a CUDA error instead of a
      # clean skip).
      # Coverage gate: --cov-fail-under=70 fails the job if overall coverage
      # drops below 70 %.
      # -----------------------------------------------------------------------
      - name: Run unit and integration tests (CPU only)
        run: >
          pytest
          -m "not cuda and not rocm"
          --cov=demne
          --cov-report=xml
          --cov-fail-under=70
          --tb=short
          -q

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests

  # ---------------------------------------------------------------------------
  # Publish job: runs ONLY on a vX.Y.Z tag pushed to main.
  # Depends on lint-and-test (needs:) → the package is published only if all
  # tests pass across the 9 OS×Python combinations.
  # Required secrets in the repo's GitHub Settings:
  #   PYPI_API_TOKEN  → token generated on pypi.org (scope: DEMNE project)
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to PyPI
    needs: lint-and-test
    runs-on: ubuntu-latest
    # Condition: this job runs only when the event is a vX.Y.Z tag push
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    permissions:
      # Required for OIDC attestation (optional but recommended by PyPI)
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip (publish job)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-ubuntu-3.12-${{ hashFiles('pyproject.toml') }}

      # build generates dist/*.whl and dist/*.tar.gz
      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      # twine checks package consistency before upload
      - name: Check package with twine
        run: |
          pip install twine
          twine check dist/*

      # Upload to PyPI using the token stored in repo secrets
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
